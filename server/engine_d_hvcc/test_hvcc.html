<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fire Offline Render</title>
    <script type="application/javascript" src="fire/js/fire.js"></script>
    <script type="text/javascript">
      window.renderOffline = async function(durationSeconds) {
        return new Promise(async (resolve, reject) => {
            try {
                const sampleRate = 44100;
                const length = sampleRate * durationSeconds;
                const offlineCtx = new OfflineAudioContext(2, length, sampleRate);

                const heavyModule = await fire_Module();
                const loader = new heavyModule.AudioLibLoader();
                
                await loader.init({
                    blockSize: 2048,
                    webAudioContext: offlineCtx
                });
                
                loader.start();
                
                console.log("Rendering...");
                const renderedBuffer = await offlineCtx.startRendering();
                console.log("Rendered!");
                
                // WAV encoding
                function encodeWAV(audioBuffer) {
                    const numChannels = audioBuffer.numberOfChannels;
                    const sampleRate = audioBuffer.sampleRate;
                    function writeString(view, offset, string) {
                        for(let i=0; i<string.length; i++) {
                            view.setUint8(offset + i, string.charCodeAt(i));
                        }
                    }
                    
                    const channelData = [];
                    for (let i = 0; i < numChannels; i++) {
                        channelData.push(audioBuffer.getChannelData(i));
                    }
                    
                    let interleaved;
                    if (numChannels === 2) {
                        const len = channelData[0].length;
                        interleaved = new Float32Array(len * 2);
                        let inputL = channelData[0];
                        let inputR = channelData[1];
                        let ix = 0;
                        for(let i=0; i<len; i++) {
                            interleaved[ix++] = inputL[i];
                            interleaved[ix++] = inputR[i];
                        }
                    } else {
                        interleaved = channelData[0];
                    }
                    
                    const buffer = new ArrayBuffer(44 + interleaved.length * 2);
                    const view = new DataView(buffer);
                    writeString(view, 0, 'RIFF');
                    view.setUint32(4, 36 + interleaved.length * 2, true);
                    writeString(view, 8, 'WAVE');
                    writeString(view, 12, 'fmt ');
                    view.setUint32(16, 16, true);
                    view.setUint16(20, 1, true);
                    view.setUint16(22, numChannels, true);
                    view.setUint32(24, sampleRate, true);
                    view.setUint32(28, sampleRate * numChannels * 2, true);
                    view.setUint16(32, numChannels * 2, true);
                    view.setUint16(34, 16, true);
                    writeString(view, 36, 'data');
                    view.setUint32(40, interleaved.length * 2, true);
                    
                    let offset = 44;
                    for (let i = 0; i < interleaved.length; i++) {
                        let s = Math.max(-1, Math.min(1, interleaved[i]));
                        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                        offset += 2;
                    }
                    return buffer;
                }

                const wavBuffer = encodeWAV(renderedBuffer);
                const bytesWav = new Uint8Array(wavBuffer);
                let binaryWav = '';
                for (let i = 0; i < bytesWav.byteLength; i++) {
                    binaryWav += String.fromCharCode(bytesWav[i]);
                }
                const b64 = window.btoa(binaryWav);
                resolve(b64);
            } catch (err) {
                reject(err.toString());
            }
        });
      };
    </script>
  </head>
  <body>
    <h1>Renderer</h1>
  </body>
</html>
